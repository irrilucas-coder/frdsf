<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Claude</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2a2f3a;
    --text: #e8eaf0; --muted: #9aa1b2; --accent: #7c5cff; --accent2: #5b3fe0;
    --ok: #2ecc71; --bad: #ff5c5c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header a { color: var(--muted); text-decoration: none; font-size: 14px; }
  .grow { flex: 1; }
  .key { display: flex; gap: 6px; align-items: center; }
  .key input { width: 260px; max-width: 60vw; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); display: inline-block; flex: none; }
  .dot.ok { background: var(--ok); }
  input, select, textarea { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  button.primary:hover { background: var(--accent2); }
  .layout { flex: 1; display: grid; grid-template-columns: 250px 1fr; min-height: 0; }
  aside { border-right: 1px solid var(--line); padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  aside button.conv { text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); background: transparent; border-color: transparent; }
  aside button.conv.active { background: var(--panel2); color: var(--text); border-color: var(--line); }
  .config { margin-top: auto; border-top: 1px solid var(--line); padding-top: 10px; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
  .config select, .config textarea { width: 100%; }
  .config textarea { min-height: 70px; resize: vertical; }
  main { display: flex; flex-direction: column; min-height: 0; }
  #msgs { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 820px; width: 100%; margin: 0 auto; }
  .bolha { padding: 12px 14px; border-radius: 12px; line-height: 1.55; overflow-wrap: anywhere; }
  .user .bolha { background: var(--accent); color: #fff; margin-left: auto; max-width: 85%; width: fit-content; white-space: pre-wrap; }
  .assistant .bolha { background: var(--panel); border: 1px solid var(--line); }
  .bolha p { margin: 0 0 10px; } .bolha p:last-child { margin-bottom: 0; }
  .bolha pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow-x: auto; }
  .bolha code { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  .bolha h2, .bolha h3, .bolha h4 { margin: 12px 0 6px; font-size: 16px; }
  .bolha ul, .bolha ol { margin: 0 0 10px; padding-left: 22px; }
  .rodape { font-size: 12px; color: var(--muted); margin-top: 4px; display: flex; gap: 10px; align-items: center; }
  .rodape button { padding: 2px 8px; font-size: 12px; }
  .pensando { color: var(--muted); font-style: italic; }
  .vazio { margin: auto; text-align: center; color: var(--muted); max-width: 420px; line-height: 1.6; }
  .vazio b { color: var(--text); }
  form { border-top: 1px solid var(--line); padding: 12px 16px; }
  .caixa { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  .caixa textarea { flex: 1; min-height: 48px; max-height: 220px; resize: none; }
  .total { font-size: 13px; color: var(--muted); }
  #menu { display: none; }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    aside { display: none; position: fixed; inset: 0; top: 0; z-index: 5; background: var(--bg); }
    aside.aberto { display: flex; }
    #menu { display: inline-block; }
    header { gap: 8px; }
    .key input { width: 100%; }
    .key { width: 100%; order: 5; }
  }
</style>
</head>
<body>
<header>
  <button id="menu" title="Conversas">☰</button>
  <h1>💬 Chat Claude</h1>
  <a href="/">← Estúdio</a>
  <span class="grow"></span>
  <span class="total" id="total"></span>
  <div class="key">
    <span class="dot" id="dot" title="chave"></span>
    <input id="chave" type="password" placeholder="Cole sua chave da API do Claude" autocomplete="off">
    <button id="verChave" title="Mostrar/ocultar">👁</button>
  </div>
</header>

<div class="layout">
  <aside id="lateral">
    <button class="primary" id="nova">＋ Nova conversa</button>
    <div id="lista"></div>
    <div class="config">
      <label>Modelo
        <select id="modelo">
          <option value="claude-opus-5-5">Opus 5.5: mais inteligente</option>
          <option value="claude-sonnet-5-5">Sonnet 5.5: equilibrado, metade do preço</option>
          <option value="claude-haiku-5-5">Haiku 5.5: rápido e bem barato</option>
        </select>
      </label>
      <label>Capricho na resposta
        <select id="esforco">
          <option value="low">Rápido</option>
          <option value="medium" selected>Normal</option>
          <option value="high">Caprichado (gasta mais)</option>
        </select>
      </label>
      <label>Instruções fixas (opcional)
        <textarea id="instrucoes" placeholder="Ex.: Você é roteirista de novelas brasileiras e escreve prompts para o Google Flow."></textarea>
      </label>
      <button id="fecharMenu" style="display:none">Fechar</button>
    </div>
  </aside>

  <main>
    <div id="msgs"></div>
    <form id="form">
      <div class="caixa">
        <textarea id="texto" placeholder="Escreva sua mensagem… (Enter envia, Shift+Enter pula linha)"></textarea>
        <button class="primary" id="enviar" type="submit">Enviar</button>
      </div>
    </form>
  </main>
</div>

<script>
// Preço por 1 milhão de tokens (US$): entrada, saída
const PRECOS = { "claude-opus-5-5": [4, 20], "claude-sonnet-5-5": [2, 10], "claude-haiku-5-5": [0.10, 0.50] };
const $ = (id) => document.getElementById(id);
const ler = (k, padrao) => { try { const v = localStorage.getItem(k); return v === null ? padrao : JSON.parse(v); } catch { return padrao; } };
const gravar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

let conversas = ler("chat.conversas", []);
let atual = ler("chat.atual", null);
let totalTokens = ler("chat.totalTokens", 0);
let controle = null;

$("chave").value = ler("chat.chave", "");
$("modelo").value = ler("chat.modelo", "claude-opus-5-5");
$("esforco").value = ler("chat.esforco", "medium");
$("instrucoes").value = ler("chat.instrucoes", "");
const atualizarDot = () => $("dot").classList.toggle("ok", $("chave").value.trim().length > 20);
atualizarDot();
$("chave").addEventListener("input", () => { gravar("chat.chave", $("chave").value.trim()); atualizarDot(); });
$("verChave").onclick = () => { $("chave").type = $("chave").type === "password" ? "text" : "password"; };
for (const id of ["modelo", "esforco", "instrucoes"]) $(id).addEventListener("change", () => gravar("chat." + id, $(id).value));
$("menu").onclick = () => { $("lateral").classList.add("aberto"); $("fecharMenu").style.display = "block"; };
$("fecharMenu").onclick = () => { $("lateral").classList.remove("aberto"); };

function conversaAtual() { return conversas.find((c) => c.id === atual); }
function salvar() { gravar("chat.conversas", conversas); gravar("chat.atual", atual); }

function escapar(s) { return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function markdown(txt) {
  const blocos = txt.split(/```/);
  return blocos.map((b, i) => {
    if (i % 2) return `<pre><code>${escapar(b.replace(/^[\w-]*\n/, ""))}</code></pre>`;
    const linhas = escapar(b).split("\n");
    let html = "", lista = null, par = [];
    const fecharPar = () => { if (par.length) { html += `<p>${par.join("<br>")}</p>`; par = []; } };
    const fecharLista = () => { if (lista) { html += `</${lista}>`; lista = null; } };
    for (let l of linhas) {
      l = l.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*(?!\s)(.+?)\*/g, "$1<i>$2</i>").replace(/`([^`]+)`/g, "<code>$1</code>")
           .replace(/(^|\s)_\((.+?)\)_/g, "$1<i>($2)</i>");
      let m;
      if ((m = l.match(/^(#{1,4})\s+(.*)/))) { fecharPar(); fecharLista(); html += `<h${Math.min(4, m[1].length + 1)}>${m[2]}</h${Math.min(4, m[1].length + 1)}>`; }
      else if ((m = l.match(/^\s*[-•*]\s+(.*)/))) { fecharPar(); if (lista !== "ul") { fecharLista(); html += "<ul>"; lista = "ul"; } html += `<li>${m[1]}</li>`; }
      else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { fecharPar(); if (lista !== "ol") { fecharLista(); html += "<ol>"; lista = "ol"; } html += `<li>${m[1]}</li>`; }
      else if (!l.trim()) { fecharPar(); fecharLista(); }
      else { fecharLista(); par.push(l); }
    }
    fecharPar(); fecharLista();
    return html;
  }).join("");
}

function custo(m) {
  if (!m.usage) return "";
  const [pe, ps] = PRECOS[m.modelo] || PRECOS["claude-opus-5-5"];
  const u = m.usage;
  const entrada = (u.input_tokens || 0) + (u.cache_creation_input_tokens || 0) + (u.cache_read_input_tokens || 0);
  const tokens = entrada + (u.output_tokens || 0);
  const usd = (entrada * pe + (u.output_tokens || 0) * ps) / 1e6;
  return `${tokens.toLocaleString("pt-BR")} tokens · ~US$ ${usd.toFixed(usd < 0.01 ? 4 : 2)}`;
}

function desenhar() {
  const lista = $("lista");
  lista.innerHTML = "";
  for (const c of conversas.slice().reverse()) {
    const b = document.createElement("button");
    b.className = "conv" + (c.id === atual ? " active" : "");
    b.textContent = c.titulo || "Nova conversa";
    b.onclick = () => { atual = c.id; salvar(); desenhar(); $("lateral").classList.remove("aberto"); };
    lista.appendChild(b);
  }
  $("total").textContent = totalTokens ? `Usado aqui: ${totalTokens.toLocaleString("pt-BR")} tokens` : "";
  const box = $("msgs");
  box.innerHTML = "";
  const c = conversaAtual();
  if (!c || !c.mensagens.length) {
    box.innerHTML = `<div class="vazio"><b>Como usar</b><br>1. Cole sua chave da API do Claude lá em cima (fica salva só neste navegador).<br>2. Escreva sua mensagem embaixo e aperte Enter.<br>3. Cada resposta mostra quantos tokens gastou.</div>`;
    return;
  }
  c.mensagens.forEach((m, i) => box.appendChild(bolha(m, i === c.mensagens.length - 1)));
  box.scrollTop = box.scrollHeight;
}

function bolha(m) {
  const div = document.createElement("div");
  div.className = "msg " + m.role;
  const b = document.createElement("div");
  b.className = "bolha";
  if (m.role === "user") b.textContent = m.content;
  else if (!m.content) b.innerHTML = `<span class="pensando">pensando…</span>`;
  else b.innerHTML = markdown(m.content);
  div.appendChild(b);
  if (m.role === "assistant" && m.content) {
    const r = document.createElement("div");
    r.className = "rodape";
    const copiar = document.createElement("button");
    copiar.textContent = "Copiar";
    copiar.onclick = () => { navigator.clipboard.writeText(m.content); copiar.textContent = "Copiado ✓"; setTimeout(() => (copiar.textContent = "Copiar"), 1500); };
    r.appendChild(copiar);
    const info = document.createElement("span");
    info.textContent = custo(m);
    r.appendChild(info);
    div.appendChild(r);
  }
  return div;
}

$("nova").onclick = () => { atual = null; salvar(); desenhar(); $("lateral").classList.remove("aberto"); $("texto").focus(); };

$("texto").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
});
$("texto").addEventListener("input", () => { const t = $("texto"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 220) + "px"; });

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (controle) { controle.abort(); return; }  // o botão vira "Parar" enquanto responde
  const texto = $("texto").value.trim();
  const chave = $("chave").value.trim();
  if (!texto) return;
  if (!chave) { alert("Cole sua chave da API do Claude no campo lá em cima primeiro."); $("chave").focus(); return; }
  let c = conversaAtual();
  if (!c) { c = { id: String(Date.now()), titulo: texto.slice(0, 40), mensagens: [] }; conversas.push(c); atual = c.id; }
  c.mensagens.push({ role: "user", content: texto });
  const resposta = { role: "assistant", content: "", modelo: $("modelo").value };
  c.mensagens.push(resposta);
  $("texto").value = ""; $("texto").style.height = "";
  salvar(); desenhar();

  controle = new AbortController();
  $("enviar").textContent = "Parar";
  const historico = c.mensagens.slice(0, -1).filter((m) => m.content && !m.erro).map((m) => ({ role: m.role, content: m.content }));
  try {
    const r = await fetch("/api/claude/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-claude-key": chave },
      body: JSON.stringify({ messages: historico, model: $("modelo").value, esforco: $("esforco").value, instrucoes: $("instrucoes").value.trim() }),
      signal: controle.signal,
    });
    if (!r.ok) {
      let msg = `Erro ${r.status}`;
      try { msg = (await r.json()).msg || msg; } catch {}
      throw new Error(msg);
    }
    const leitor = r.body.getReader();
    const dec = new TextDecoder();
    let tudo = "";
    const ultima = () => $("msgs").lastElementChild;
    while (true) {
      const { done, value } = await leitor.read();
      if (done) break;
      tudo += dec.decode(value, { stream: true });
      resposta.content = tudo.split("\u0000")[0];
      const nova = bolha(resposta);
      ultima().replaceWith(nova);
      $("msgs").scrollTop = $("msgs").scrollHeight;
    }
    const [txt, extra] = tudo.split("\u0000");
    resposta.content = txt;
    if (extra) {
      try {
        const info = JSON.parse(extra);
        resposta.usage = info.usage;
        const u = info.usage || {};
        totalTokens += (u.input_tokens || 0) + (u.output_tokens || 0) + (u.cache_creation_input_tokens || 0) + (u.cache_read_input_tokens || 0);
        gravar("chat.totalTokens", totalTokens);
      } catch {}
    }
  } catch (err) {
    if (err.name === "AbortError") resposta.content = (resposta.content || "") + "\n\n_(parado)_";
    else { resposta.content = `⚠️ ${err.message}`; resposta.erro = true; }
  } finally {
    controle = null;
    $("enviar").textContent = "Enviar";
    if (!resposta.content) c.mensagens.pop();
    salvar(); desenhar();
  }
});

desenhar();
</script>
</body>
</html>
