<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Lilita One"; src: url("/node_modules/@fontsource/lilita-one/files/lilita-one-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Lilita One"; src: url("/node_modules/@fontsource/lilita-one/files/lilita-one-latin-ext-400-normal.woff2") format("woff2"); unicode-range: U+0100-024F; }
html,body { margin:0; background:#000; }
canvas { display:block; max-width:100vw; max-height:100vh; }
</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }</script>
</head><body>
<script type="module">
import { Motor } from './cena.js';
const q = new URLSearchParams(location.search);
window.iniciar = async (ep, bib) => {
  const m = new Motor({ largura: ep.largura || 1080, altura: ep.altura || 1920 });
  document.fonts.add(await new FontFace('Lilita One', 'url(/node_modules/@fontsource/lilita-one/files/lilita-one-latin-400-normal.woff2)').load());
  await m.carregar(ep, bib);
  window.motor = m;
  if (q.has('ver')) document.body.appendChild(m.out);
  return { quadros: m.totalQuadros, fps: m.fps, duracao: m.duracao };
};
window.quadro = (f, qualidade = 0.92) => window.motor.desenhar(f).toDataURL('image/jpeg', qualidade).split(',')[1];
window.png = (f) => window.motor.desenhar(f).toDataURL('image/png').split(',')[1];
window.pronto = true;
if (q.has('ep')) {
  const ep = await (await fetch('/' + q.get('ep'))).json();
  const bib = await (await fetch('/biblioteca/personagens.json')).json();
  await window.iniciar(ep, bib);
  let f = 0; const loop = () => { window.motor.desenhar(f); f = (f + 1) % window.motor.totalQuadros; requestAnimationFrame(loop); }; loop();
}
</script>
</body></html>
